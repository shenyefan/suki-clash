[package]
name = "suki-clash"
version = "0.6.4"
edition = "2024"

[dependencies]
suki_service = { package = "suki-clash-service", path = "platform-service", features = ["client"] }
anyhow = "1.0.104"
log = { version = "0.4.35", features = ["std"] }
gpui-kit = { version = "0.9.1", features = ["tree-sitter-yaml", "tree-sitter-javascript"] }
regex = "1.13.1"
url = "2.5.8"
percent-encoding = "2.3.2"
age = { version = "0.12.1", default-features = false, features = ["armor"] }
getrandom = "0.4.3"
serde_yaml_ng = { version = "0.10.0", default-features = false }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
async-channel = "2.5.0"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.54.1", features = ["rt", "net", "process", "sync", "time", "io-util", "macros", "fs"] }
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "socks", "system-proxy"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", features = ["sink"] }
netdev = { version = "0.47.0", default-features = false, features = ["gateway"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk", "gpu"] }
ipnet = "2.12.2"
zip = { version = "9.4.0", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.11.1"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
usvg = { version = "0.49.0", default-features = false, features = ["writer"] }
flate2 = "1.1.10"
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
auto-launch = "0.6.0"
velopack = { version = "=1.3.39-g8d2844f", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_Networking_WinInet", "Win32_NetworkManagement_Rras"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
system-configuration = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6.1.0"
# GPUI's Linux portals use async-io; ashpd forbids enabling tokio alongside it.
oo7 = { version = "0.7.0", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
