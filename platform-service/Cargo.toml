[package]
name = "suki-clash-service"
version = "2.7.6"
edition = "2024"
authors = ["Tunglies"]
license = "GPL-3.0"

[lib]
name = "suki_clash_service"
path = "src/lib.rs"

[[bin]]
name = "suki-clash-service"
path = "src/bin/service.rs"
required-features = ["standalone"]

[[bin]]
name = "mock_binary"
path = "src/bin/mock_binary.rs"
required-features = ["test"]

[[bin]]
name = "crash_binary"
path = "src/bin/crash_binary.rs"
required-features = ["test"]

[[bin]]
name = "owner_lock_holder"
path = "src/bin/owner_lock_holder.rs"
required-features = ["standalone", "test"]

[[bin]]
name = "service-integration-driver"
path = "src/bin/service_integration_driver.rs"
required-features = ["client"]

[features]
development-channel = []
standalone = [
    "client",
    "kode-bridge",
    "kode-bridge/client",
    "http",
    "tracing",
    "tracing-subscriber",
    "tokio",
    "anyhow",
    "once_cell",
    "serde_json",
    "dep:tracing-estuary",
    "dep:parking_lot",
    "flexi_logger",
    "log",
    "response",
    "dep:platform_lib",
    "dep:nix",
    "dep:windows-sys",
]
client = [
    "kode-bridge/client",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "anyhow",
    "log",
    "tokio",
    "once_cell",
    "serde_json",
    "response",
    "dep:platform_lib",
    "dep:windows-sys",
]
response = []
test = [
    "anyhow",
    "dep:platform_lib",
    "dep:windows-sys",
]
default = []


[dependencies]
kode-bridge = { version = "0.5.2", features = ["server"], optional = true }
once_cell = { version = "1.21", features = ["parking_lot"], optional = true }
anyhow = { version = "1.0", optional = true }
http = { version = "1.3", optional = true }
hyper = { version = "1.12.0", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
http-body-util = { version = "0.1.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = "0.11"
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tokio = { version = "1.52", features = [
    "process",
    "io-util",
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "time",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-estuary = { git = "https://github.com/Tunglies/tracing-estuary.git", branch = "main", optional = true }
flexi_logger = { version = "0.31", optional = true }
log = { version = "0.4.28", optional = true }
parking_lot = { version = "0.13", optional = true }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8.0"
security-framework-sys = "2.17.0"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
platform_lib = { package = "libc", version = "0.2", optional = true }
nix = { version = "0.31", features = ["user"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features=["Win32_System_Com","Win32_NetworkManagement_WindowsFirewall","Win32_Foundation"]}

platform_lib = { package = "windows-service", version = "0.8", optional = true }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
kode-bridge = { version = "0.5.2", default-features = false, features = [
    "server",
    "client",
] }
serde_json = "1.0"
serial_test = "4.0"
tempfile = "3.27.0"

[profile.release]
panic = "abort"
lto = "thin"
opt-level = 3
codegen-units = 1

[build-dependencies]
embed-resource = "3.0.12"
