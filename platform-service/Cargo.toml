[package]
name = "suki-clash-service"
version = "0.1.1"
edition = "2024"

[lib]
name = "suki_clash_service"
path = "src/lib.rs"

[[bin]]
name = "suki-clash-service"
path = "src/bin/service.rs"
required-features = ["standalone"]

[[bin]]
name = "mock_binary"
path = "src/bin/mock_binary.rs"
required-features = ["test"]

[[bin]]
name = "service-integration-driver"
path = "src/bin/service_integration_driver.rs"
required-features = ["client"]

[features]
development-channel = []
standalone = [
    "client",
    "hyper/server",
    "http",
    "tracing",
    "tracing-subscriber",
    "dep:tracing-log",
    "dep:parking_lot",
    "flexi_logger",
    "dep:nix",
    "dep:url",
    "dep:embed-resource",
]
client = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "anyhow",
    "log",
    "tokio",
    "once_cell",
    "serde_json",
    "response",
    "dep:libc",
    "dep:windows-service",
    "dep:windows",
]
response = []
test = [
    "anyhow",
    "dep:libc",
    "dep:windows-service",
]
default = []


[dependencies]
once_cell = { version = "1.21", features = ["parking_lot"], optional = true }
anyhow = { version = "1.0", optional = true }
http = { version = "1.3", optional = true }
hyper = { version = "1.12.0", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
http-body-util = { version = "0.1.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = "0.11"
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tokio = { version = "1.52", features = [
    "net",
    "process",
    "io-util",
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "time",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-log = { version = "0.2", optional = true }
flexi_logger = { version = "0.31", optional = true }
log = { version = "0.4.28", optional = true }
parking_lot = { version = "0.13", optional = true }
url = { version = "2.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8.0"
security-framework-sys = "2.17.0"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
nix = { version = "0.31", features = ["user"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_System_Com", "Win32_NetworkManagement_WindowsFirewall", "Win32_Foundation"] }

windows-service = { version = "0.8", optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1.0"
serial_test = "4.0"
tempfile = "3.27.0"

[profile.release]
panic = "abort"
lto = "thin"
opt-level = 3
codegen-units = 1

[build-dependencies]
embed-resource = { version = "3.0.12", optional = true }
