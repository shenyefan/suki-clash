name: Build desktop packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  SUKI_UPDATE_REPOSITORY: ${{ github.repository }}
  VELOPACK_VERSION: "1.2.161"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: version
        name: Validate version and tag
        shell: python
        run: |
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          assert "-" not in version and "+" not in version, "this initial workflow accepts stable versions only"
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert os.environ["GITHUB_REF_NAME"] == "v" + version, "tag must match Cargo.toml version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + "\n")
      - name: Snapshot runtime assets for release targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/runtime.py --resolve runtime-lock.json
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-lock
          path: runtime-lock.json
          retention-days: 14

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            channel: win-x64
            msvc_arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            channel: win-arm64
            msvc_arch: arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            channel: osx-arm64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            channel: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Enable Windows checkout long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Select matching MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.${{ matrix.msvc_arch == 'arm64' && 'ARM64' || 'x86.x64' }} -property installationPath
          if (-not $installation) { throw "Visual Studio C++ toolchain not found" }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -SkipAutomaticLocation -Arch ${{ matrix.msvc_arch == 'x64' && 'amd64' || 'arm64' }} -HostArch amd64
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Link the Windows runtime statically for portable builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libwayland-dev libssl-dev libasound2-dev libudev-dev libvulkan-dev libgit2-dev patchelf file
          sudo apt-get install -y libfuse2
      - name: Install pinned Velopack CLI
        shell: bash
        run: dotnet tool install vpk --version "$VELOPACK_VERSION" --tool-path .tools
      - uses: actions/download-artifact@v7
        with:
          name: runtime-lock
          path: ${{ runner.temp }}/runtime-input
      - name: Prepare verified offline runtime
        shell: bash
        run: python packaging/runtime.py --lock "$RUNNER_TEMP/runtime-input/runtime-lock.json" --target "${{ matrix.target }}" --output "$RUNNER_TEMP/runtime"
      - name: Check packaging regressions
        run: python -m unittest discover -s packaging -p 'test_*.py'
      - name: Build application
        run: cargo build --locked --release --target ${{ matrix.target }} --bin suki-clash
      - name: Build service with integrated maintenance
        run: cargo build --locked --release --manifest-path platform-service/Cargo.toml --target ${{ matrix.target }} --features standalone,client --bin suki-clash-service
      - name: Prepare optional signing identities
        env:
          SUKI_WINDOWS_CERTIFICATE_P12: ${{ secrets.SUKI_WINDOWS_CERTIFICATE_P12 }}
          SUKI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SUKI_WINDOWS_CERTIFICATE_PASSWORD }}
          SUKI_MACOS_CERTIFICATE_P12: ${{ secrets.SUKI_MACOS_CERTIFICATE_P12 }}
          SUKI_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.SUKI_MACOS_CERTIFICATE_PASSWORD }}
          SUKI_MACOS_APPLICATION_IDENTITY: ${{ secrets.SUKI_MACOS_APPLICATION_IDENTITY }}
          SUKI_MACOS_INSTALLER_IDENTITY: ${{ secrets.SUKI_MACOS_INSTALLER_IDENTITY }}
          SUKI_APPLE_API_KEY_P8: ${{ secrets.SUKI_APPLE_API_KEY_P8 }}
          SUKI_APPLE_API_KEY_ID: ${{ secrets.SUKI_APPLE_API_KEY_ID }}
          SUKI_APPLE_API_ISSUER: ${{ secrets.SUKI_APPLE_API_ISSUER }}
        run: python packaging/signing.py
      - name: Package native outputs
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python packaging/velopack.py --target "$BUILD_TARGET" --app-dir "target/$BUILD_TARGET/release" --service-dir "platform-service/target/$BUILD_TARGET/release" --work "$RUNNER_TEMP/package" --runtime-dir "$RUNNER_TEMP/runtime" --vpk "$GITHUB_WORKSPACE/.tools/vpk"
      - name: Upload packages and isolated release feed
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.channel }}
          path: ${{ runner.temp }}/package/Releases/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: python packaging/signing.py --cleanup

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          path: packages
      - name: Assemble user downloads and release description
        shell: python
        run: |
          import json, pathlib, shutil
          output = pathlib.Path("Releases")
          output.mkdir()
          downloads = {
              "win-x64": ("Windows x64", ("Setup.exe", "Portable.zip")),
              "win-arm64": ("Windows ARM64", ("Setup.exe", "Portable.zip")),
              "osx-arm64": ("macOS Apple Silicon", ("Setup.pkg", "Portable.zip")),
              "linux-x64": ("Linux x64", ("AppImage",)),
          }
          notes = [
              "## 下载", "",
              "按系统和架构选择下方附件。Windows 提供安装版和免安装压缩包；macOS 提供安装包和应用压缩包；Linux 提供 AppImage。", "",
              "| 平台 | 文件 | 签名状态 |", "| --- | --- | --- |",
          ]
          for channel, (label, formats) in downloads.items():
              source = pathlib.Path("packages") / ("packages-" + channel)
              metadata = json.loads((source / f"build.{channel}.json").read_text())
              status = ("已签名并公证" if channel.startswith("osx") else "已签名") if metadata["signed"] else "未签名"
              for suffix in formats:
                  name = f"SukiClash-{channel}" + ("." if suffix == "AppImage" else "-") + suffix
                  package = source / name
                  if not package.is_file() or package.stat().st_size == 0:
                      raise ValueError("missing or empty release package: " + str(package))
                  shutil.copy2(package, output / name)
                  notes.append(f"| {label} | `{name}` | {status} |")
          notes.extend([
              "", "## 使用说明", "",
              "- 已内置 Mihomo 内核和 Geo 数据。",
              "- 免安装版的用户配置仍保存在系统应用目录；TUN 需要相应服务与权限。",
              "- Linux 下载后需为 AppImage 添加执行权限。",
              "- 此版本通过下载安装包或压缩包手动升级。", "",
          ])
          pathlib.Path("release-notes.md").write_text("\n".join(notes), encoding="utf-8")
      - name: Create or update one draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body >> release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft,assets > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "refusing to change a published release"'
            gh release edit "$RELEASE_TAG" --title "Suki Clash $RELEASE_TAG" --notes-file release-notes.md
            python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          expected = {path.name for path in pathlib.Path("Releases").iterdir()}
          for asset in json.loads(pathlib.Path("release.json").read_text())["assets"]:
              if asset["name"] not in expected:
                  subprocess.run(["gh", "release", "delete-asset", os.environ["RELEASE_TAG"], asset["name"], "--yes"], check=True)
          PYTHON
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Suki Clash $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" Releases/* --clobber
