name: Build desktop packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  SUKI_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Validate version and tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "suki-clash") | .version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only stable versions are supported"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match Cargo.toml version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download, verify and unpack offline runtime for all targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/runtime.sh runtime
      - uses: actions/upload-artifact@v7
        with:
          name: runtime
          path: runtime/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            channel: win-x64
            msvc_arch: x64
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            channel: win-arm64
            msvc_arch: arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            channel: osx-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            channel: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_CHANNEL: ${{ matrix.channel }}
    steps:
      - name: Enable Windows checkout long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Select matching MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.${{ matrix.msvc_arch == 'arm64' && 'ARM64' || 'x86.x64' }} -property installationPath
          if (-not $installation) { throw "Visual Studio C++ toolchain not found" }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -SkipAutomaticLocation -Arch ${{ matrix.msvc_arch == 'x64' && 'amd64' || 'arm64' }} -HostArch amd64
          $env:GPUI_FXC_PATH = (Get-Command fxc.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Link the Windows runtime statically for portable builds
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libwayland-dev libssl-dev libasound2-dev libudev-dev libvulkan-dev libgit2-dev patchelf file
          sudo apt-get install -y libfuse2 squashfs-tools desktop-file-utils
      - name: Restore official Velopack local tool
        run: dotnet tool restore
      - uses: actions/download-artifact@v8
        with:
          name: runtime
          path: ${{ runner.temp }}/runtime
      - name: Build application
        run: cargo build --locked --release --target "$BUILD_TARGET" --bin suki-clash
      - name: Build service with integrated maintenance
        run: cargo build --locked --release --manifest-path platform-service/Cargo.toml --target "$BUILD_TARGET" --features standalone,client --bin suki-clash-service
      - name: Stage application files
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/stage.sh "$BUILD_TARGET" "$BUILD_VERSION" "$RUNNER_TEMP/runtime/$BUILD_TARGET" "$RUNNER_TEMP/package/stage"
      - name: Pack with official Velopack CLI
        run: bash packaging/pack.sh "$BUILD_VERSION" "$BUILD_TARGET" "$BUILD_CHANNEL" "$RUNNER_TEMP/package/stage" "$RUNNER_TEMP/package/Releases"
      - name: Upload packages and isolated release feed
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.channel }}
          path: ${{ runner.temp }}/package/Releases/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
      - name: Create or update one draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash packaging/release.sh "${{ needs.prepare.outputs.version }}" "$GITHUB_REF_NAME" packages
